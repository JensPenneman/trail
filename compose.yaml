# Development services — `npm run dev` starts them. The production stack is
# deploy/compose.yaml.
name: trail-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trail
      # libc-independent collation: the data directory stays valid if the
      # image ever moves between Alpine (musl) and Debian (glibc)
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db:/var/lib/postgresql
      - ./scripts/db/init-dev.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trail"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
