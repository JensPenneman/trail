# Trail on Launchway, the owner's self-hosted deployment platform. Runbook:
# docs/operations.md.
#
# Launchway deploys this file for production (a published GitHub release) and
# for previews (pull requests from this repository), each as its own Compose
# project. It writes the app's variables to deploy/.env and adds its own:
# LAUNCHWAY_COMMIT_SHA_SHORT selects the image, LAUNCHWAY_PUBLIC_URL is the
# address of the deployment's host name. It attaches `app` to its proxy
# network, where its edge forwards the route to port 8080; no host port is
# published.
#
#   production  COMPOSE_PROFILES=production starts `backup` too, and
#               TRAIL_DB_VOLUME names the existing database volume
#   preview     no profile, no host mounts, a database volume of its own
#
# A local run of the working tree: compose.dev.yaml next to this file.
#
# `$$` below is a literal `$` for the containers; a single `$` is filled in by
# Compose from .env.

name: trail

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    # The image CI built and tested for the deployed commit; nothing is built
    # on the server. CI publishes sha-<commit> for every push to a branch of
    # this repository and for version tags, after all tests pass. Until the
    # image exists the pull fails, and Launchway retries it. TRAIL_IMAGE
    # replaces it for local runs (compose.dev.yaml); Launchway leaves it unset.
    image: ${TRAIL_IMAGE:-ghcr.io/jenspenneman/trail:sha-${LAUNCHWAY_COMMIT_SHA_SHORT:?Launchway sets LAUNCHWAY_COMMIT_SHA_SHORT; local runs set TRAIL_IMAGE}}
    pull_policy: always
    restart: unless-stopped
    init: true
    # the app's graceful shutdown (draining requests and SSE, flushing
    # statistics) takes up to 13 s; Docker's default is 10 s
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    # An explicit list instead of env_file: the app never sees the rest of
    # .env. Entries without a value are passed only when .env sets them, so
    # the app's own defaults (docs/architecture.md section 4) apply otherwise.
    environment:
      DATABASE_URL: postgres://trail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trail
      # A preview runs on its own host name: without PUBLIC_URL it takes the
      # deployment's address from Launchway.
      PUBLIC_URL: ${PUBLIC_URL:-${LAUNCHWAY_PUBLIC_URL:?set PUBLIC_URL (Launchway sets LAUNCHWAY_PUBLIC_URL)}}
      ADDITIONAL_ORIGINS:
      INGEST_BASE_URL:
      SIGNUP_ALLOWLIST:
      # Only Launchway's edge may set X-Forwarded-* (client address, HTTPS):
      # its fixed address on Launchway's proxy network.
      TRUST_PROXY: ${TRUST_PROXY:-10.210.0.2}
      SESSION_TTL_DAYS:
      LIVE_WINDOW_MINUTES:
      STALE_AFTER_HOURS:
      ALERT_NTFY_URL:
      ALERT_NTFY_TOKEN:
      DEFAULT_TIMEZONE:
      MAP_STYLE_LIGHT:
      MAP_STYLE_DARK:
      MAP_CONNECT_SRC:
      LOG_LEVEL:
      RATE_LIMIT_AUTH_PER_MINUTE:
      RATE_LIMIT_API_PER_MINUTE:
      RATE_LIMIT_INGEST_PER_MINUTE:
      RATE_LIMIT_INGEST_FAILED_PER_10_MINUTES:
    # default: the way out (ntfy alerts); backend: the database
    networks: [default, backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      # same probe as the image's HEALTHCHECK: liveness only, no database
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trail
      POSTGRES_DB: trail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # libc-independent collation, as in development: the data directory
      # stays valid if the image ever moves between Alpine (musl) and Debian
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      # Postgres 18+ images keep the cluster in /var/lib/postgresql/18/docker,
      # so a future major version can sit next to it for pg_upgrade
      - trail-db:/var/lib/postgresql
    networks: [backend]
    shm_size: 256mb
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trail"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  backup:
    image: postgres:18-alpine
    # production only: previews keep no backups and need no host folder
    profiles: ["production"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/trail-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Brussels}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_KEEP_YEARS: ${BACKUP_KEEP_YEARS:-0}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      PGHOST: db
      PGUSER: trail
      PGDATABASE: trail
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: "10"
    configs:
      - source: backup-script
        target: /etc/trail-backup.sh
    volumes:
      # BACKUP_DIR: an existing absolute folder, as the Docker daemon sees it;
      # a relative path would land in the deployment's checkout, which
      # Launchway deletes later. Launchway allows the bind mount because Trail
      # is marked trusted. No `:?` check here: Compose checks variables of
      # every service, including the previews' inactive `backup`; a missing
      # folder fails at the start instead.
      - type: bind
        source: ${BACKUP_DIR:-/set-BACKUP_DIR-to-an-absolute-folder}
        target: /backups
        bind:
          create_host_path: false
    # The image declares a volume for a database this container never runs;
    # a tmpfs keeps Docker from creating an anonymous volume on every recreate.
    tmpfs:
      - /var/lib/postgresql
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

networks:
  # app, db and backup only; no route out
  backend:
    internal: true

volumes:
  # The location history. Production: TRAIL_DB_VOLUME names a volume created
  # once by hand (`docker volume create trail-db`, docs/operations.md). Compose
  # only removes volumes it created itself, so `docker compose down -v` leaves
  # that one alone; it warns that the volume "was not created by Docker
  # Compose", which is expected. Previews leave TRAIL_DB_VOLUME empty and get a
  # volume of their own project, removed with the preview.
  trail-db:
    name: ${TRAIL_DB_VOLUME:-${COMPOSE_PROJECT_NAME}_trail-db}

configs:
  backup-script:
    content: |
      #!/bin/sh
      # Database backups for the `backup` service (see docs/operations.md).
      # Once a day at BACKUP_HOUR local time (TZ), pg_dump writes a custom-format
      # dump to /backups/trail-<UTC timestamp>.dump; it counts only once
      # pg_restore can read it back. The first dump of every month is also kept in
      # monthly/ and the first of every year in yearly/. Daily dumps (and the
      # pre-update/ dumps left by the former standalone stack) are deleted after BACKUP_KEEP_DAYS
      # days, monthly ones after BACKUP_KEEP_MONTHS months, yearly ones after
      # BACKUP_KEEP_YEARS years; 0 keeps them forever. It also dumps right after
      # starting when the newest dump is more than a day old (first start, the
      # laptop was off, a failed run) or when BACKUP_ON_START=true. Any failure
      # exits non-zero: Docker restarts the container and the restart retries.
      set -eu

      dir=/backups
      hour=$${BACKUP_HOUR:-3}
      keep_days=$${BACKUP_KEEP_DAYS:-14}
      keep_months=$${BACKUP_KEEP_MONTHS:-12}
      keep_years=$${BACKUP_KEEP_YEARS:-0}
      on_start=$${BACKUP_ON_START:-false}
      stop=0

      log() {
        printf '%s %s\n' "$$(date +%Y-%m-%dT%H:%M:%S%z)" "$$*"
      }

      die() {
        log "ERROR: $$*"
        exit 1
      }

      # dump_within MINUTES: true when a finished dump younger than that exists
      dump_within() {
        [ -n "$$(find "$$dir" -maxdepth 1 -type f -name 'trail-*.dump' -mmin "-$$1" | head -n 1)" ]
      }

      # prune DIR DAYS: deletes the dumps in DIR older than DAYS days
      prune() {
        [ -d "$$1" ] || return 0
        find "$$1" -maxdepth 1 -type f -name 'trail-*.dump' -mmin "+$$(($$2 * 1440))" |
          while read -r old; do
            rm -f "$$old"
            log "deleted $${old#"$$dir"/} (older than $$2 days)"
          done
      }

      # keep_copy KIND PERIOD FILE: keeps the first dump of a month or year
      keep_copy() {
        target="$$dir/$$1/trail-$$2.dump"
        if [ -e "$$target" ]; then
          return 0
        fi
        mkdir -p "$$dir/$$1"
        cp "$$3" "$$dir/$$1/.trail-$$2.dump.partial"
        mv "$$dir/$$1/.trail-$$2.dump.partial" "$$target"
        log "kept $${target#"$$dir"/}"
      }

      backup() {
        stamp=$$(date -u +%Y%m%dT%H%M%SZ)
        file="$$dir/trail-$$stamp.dump"
        # written under a temporary name and renamed when complete, so a dump that
        # carries the final name is never partial
        partial="$$dir/.trail-$$stamp.dump.partial"
        started=$$(date +%s)
        log "dumping database $${PGDATABASE:-} to $${file##*/}"
        if ! pg_dump --format=custom --file="$$partial"; then
          rm -f "$$partial"
          die "pg_dump failed; the container restarts and tries again"
        fi
        # a dump only counts once it can be read back
        if ! pg_restore --list "$$partial" > /dev/null; then
          rm -f "$$partial"
          die "the new dump cannot be read back; the container restarts and tries again"
        fi
        mv "$$partial" "$$file"
        log "backup complete: $${file##*/}, $$(du -k "$$file" | cut -f1) KiB in $$(($$(date +%s) - started)) s"
        keep_copy monthly "$$(date -u +%Y-%m)" "$$file"
        keep_copy yearly "$$(date -u +%Y)" "$$file"
        prune "$$dir" "$$keep_days"
        prune "$$dir/pre-update" "$$keep_days"
        if [ "$$keep_months" -gt 0 ]; then
          prune "$$dir/monthly" "$$((keep_months * 31))"
        fi
        if [ "$$keep_years" -gt 0 ]; then
          prune "$$dir/yearly" "$$((keep_years * 366))"
        fi
      }

      case $$hour in
        '' | *[!0-9]*) die "BACKUP_HOUR must be an hour from 0 to 23, got '$$hour'" ;;
      esac
      hour=$${hour#0}
      hour=$${hour:-0}
      [ "$$hour" -le 23 ] || die "BACKUP_HOUR must be an hour from 0 to 23, got '$$hour'"
      case $$keep_days in
        '' | *[!0-9]* | 0) die "BACKUP_KEEP_DAYS must be a whole number of days (1 or more), got '$$keep_days'" ;;
      esac
      case $$keep_months in
        '' | *[!0-9]*) die "BACKUP_KEEP_MONTHS must be a whole number (0 = forever), got '$$keep_months'" ;;
      esac
      case $$keep_years in
        '' | *[!0-9]*) die "BACKUP_KEEP_YEARS must be a whole number (0 = forever), got '$$keep_years'" ;;
      esac
      if [ ! -d "$$dir" ] || [ ! -w "$$dir" ]; then
        die "$$dir is not a writable directory; check BACKUP_DIR in .env"
      fi

      # SIGTERM (docker stop) lets a running dump finish, then leaves the loop
      trap 'stop=1' TERM INT

      # leftovers of a dump or copy that was interrupted
      find "$$dir" -maxdepth 2 -type f -name '.trail-*.dump.partial' -exec rm -f {} +

      log "daily backups at $$hour:00 $${TZ:-UTC} to BACKUP_DIR: daily $$keep_days days, monthly $$keep_months months, yearly $$keep_years years (0 = forever)"
      if [ "$$on_start" = true ] || ! dump_within 1440; then
        backup
      fi

      while [ "$$stop" -eq 0 ]; do
        now=$$(date +%H)
        now=$${now#0}
        if [ "$${now:-0}" -eq "$$hour" ] && ! dump_within 60; then
          backup
        fi
        # sleeping in the background keeps the shell responsive to SIGTERM
        sleep 60 &
        wait $$! || true
      done
      log "stopped"
