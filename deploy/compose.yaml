# Trail on Launchway, the owner's self-hosted deployment platform. Runbook:
# docs/operations.md.
#
# Launchway deploys this file for production (a published GitHub release) and
# for previews (pull requests from this repository), each as its own Compose
# project, and builds the image from the checked-out ref. It writes the app's
# variables to deploy/.env and adds its own:
# LAUNCHWAY_COMMIT_SHA_SHORT names the image it builds, LAUNCHWAY_PUBLIC_URL is the
# address of the deployment's host name. It attaches `app` to its proxy
# network, where its edge forwards the route to port 8080; no host port is
# published. `worker` runs the same image as `trail worker`, the processing
# out of the API's container; it publishes nothing and the edge never reaches
# it.
#
#   production  COMPOSE_PROFILES=production starts `backup` too, and
#               `predeploy-dump` dumps before `app` and `worker` start on
#               every `up`; TRAIL_DB_VOLUME names the existing database
#               volume
#   preview     no profile, no host mounts, a database volume of its own;
#               `predeploy-dump` runs and skips (LAUNCHWAY_ENVIRONMENT)
#
# A local run of the working tree: compose.dev.yaml next to this file.
#
# `$$` below is a literal `$` for the containers; a single `$` is filled in by
# Compose from .env.

name: trail

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# The environment of `app` and `worker`, one list for both, so both processes
# validate the same configuration (an invalid value stops either). An explicit
# list instead of env_file: the containers never see the rest of .env.
# Entries without a value are passed only when .env sets them, so the app's
# own defaults (docs/architecture.md section 4) apply otherwise. Each service
# adds its PROCESSING_ROLE and NODE_OPTIONS; the worker's port is fixed below,
# and PROCESSING_TEST_STALL (a test of the worker's health check) is only ever
# set by compose.dev.yaml.
x-app-environment: &app-environment
  DATABASE_URL: postgres://trail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trail
  # A preview runs on its own host name: without PUBLIC_URL it takes the
  # deployment's address from Launchway.
  PUBLIC_URL: ${PUBLIC_URL:-${LAUNCHWAY_PUBLIC_URL:?set PUBLIC_URL (Launchway leaves LAUNCHWAY_PUBLIC_URL empty for an app without a public route)}}
  ADDITIONAL_ORIGINS:
  MCP_ALLOWED_ORIGINS:
  INGEST_BASE_URL:
  SIGNUP_ALLOWLIST:
  # Only Launchway's edge may set X-Forwarded-* (client address, HTTPS):
  # its fixed address on Launchway's proxy network.
  TRUST_PROXY: ${TRUST_PROXY:-10.210.0.2}
  SESSION_TTL_DAYS:
  LIVE_WINDOW_MINUTES:
  STALE_AFTER_HOURS:
  DATA_ACCESS_RETENTION_DAYS:
  ALERT_NTFY_URL:
  ALERT_NTFY_TOKEN:
  DEFAULT_TIMEZONE:
  MAP_STYLE_LIGHT:
  MAP_STYLE_DARK:
  MAP_STYLE_SATELLITE:
  MAP_STYLE_SATELLITE_ATTRIBUTION:
  MAP_CONNECT_SRC:
  # the basemap `app` serves from trail-map (docs/operations.md, "The basemap")
  MAP_BASEMAP:
  MAP_BASEMAP_REGION:
  MAP_BASEMAP_FALLBACK:
  LOG_LEVEL:
  RATE_LIMIT_AUTH_PER_MINUTE:
  RATE_LIMIT_API_PER_MINUTE:
  RATE_LIMIT_INGEST_PER_MINUTE:
  RATE_LIMIT_INGEST_SINGLE_PER_MINUTE:
  RATE_LIMIT_INGEST_FAILED_PER_10_MINUTES:
  RATE_LIMIT_TOKEN_PER_MINUTE:
  RATE_LIMIT_TOKEN_FAILED_PER_10_MINUTES:
  RATE_LIMIT_PUBLIC_SHARE_PER_MINUTE:
  RATE_LIMIT_MAP_PER_MINUTE:
  # location processing; an empty PROCESSING_OVERPASS_URL (set in .env)
  # means no map data, an unset one the public Overpass instance
  PROCESSING_ENABLED:
  PROCESSING_OVERPASS_URL:
  PROCESSING_OVERPASS_DAILY_MB:
  PROCESSING_OSM_TTL_DAYS:
  PROCESSING_MAX_ACCURACY_M:
  PROCESSING_STOP_MIN_S:
  PROCESSING_PASS_MAX_POINTS:
  PROCESSING_PASS_MAX_SPAN_HOURS:
  # map data from the registry (docs/operations.md, "Map data"), which `app`
  # pulls into trail-map; an empty MAP_DATA_REGIONS (set in .env) means none,
  # an unset one Belgium. MAP_DATA_DIR stays the image's default, the mount.
  MAP_DATA_REGIONS:
  MAP_DATA_REGISTRY:
  MAP_DATA_REGISTRY_TOKEN:
  MAP_DATA_REFRESH_DAYS:
  MAP_DATA_MAX_GB:
  # `trail load-fleet` only (docs/perf/README.md): a preview's load test sets
  # LOAD_TEST=true, and Launchway's name of the deployment (production or
  # preview) makes the command refuse anywhere but in a preview. Launchway
  # writes it to .env; it is the one of its variables the containers receive.
  LOAD_TEST:
  LAUNCHWAY_ENVIRONMENT:

services:
  app:
    # Built from the checked-out ref on the server; no registry is involved,
    # and a local tag cannot be pulled, so there is no pull_policy. The tag
    # carries the commit, so every deployment has an image of its own and a
    # rollback finds the old one again. GIT_SHA is what /api/config reports.
    # TRAIL_IMAGE replaces the tag for local runs (compose.dev.yaml);
    # Launchway leaves it unset.
    build: &build
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${LAUNCHWAY_COMMIT_SHA_SHORT:-dev}
    image: &image ${TRAIL_IMAGE:-trail-local:${LAUNCHWAY_COMMIT_SHA_SHORT:?Launchway sets LAUNCHWAY_COMMIT_SHA_SHORT; local runs set TRAIL_IMAGE}}
    restart: unless-stopped
    init: true
    # the app's graceful shutdown (draining requests and SSE, flushing
    # statistics) takes up to 13 s; Docker's default is 10 s
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      # a failed dump keeps the update from starting. Deliberately a hard
      # dependency: with `required: false` Compose only warns about a
      # one-shot that failed and starts the new containers anyway (Compose
      # v5.7.0, checked), which would migrate a database without a dump.
      predeploy-dump: &after-dump
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      # What this container runs, fixed here and not taken from .env
      # (docs/architecture.md section 3): the API, the phones' ingest and the
      # dashboard. It queues the processing, which `worker` does.
      PROCESSING_ROLE: api
      # The V8 heap's limit, set instead of Node's own guess from mem_limit
      # (about 560 MB of the 1 GB on Node 24; other V8 versions guess
      # otherwise). The API processes nothing in this role; `trail reprocess`
      # run here by hand still does (docs/operations.md), in a second Node
      # process with a limit of its own, and a piece of map data holds up to
      # ~250 MB: 640 MB leaves the rest of the 1 GB to memory outside the
      # heap, so a heap fails in the log before the kernel would OOM-kill the
      # container.
      NODE_OPTIONS: --max-old-space-size=640
    # default: the way out (ntfy alerts, map data from the registry); backend:
    # the database
    networks: [default, backend]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # the regions' map data, pulled from the registry and rebuildable from it
      - trail-map:/var/lib/trail/map
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Explicit CPU caps (docs/operations.md, "What runs"): without one, a
    # single process could take every CPU of the node. Two: a page of the
    # dashboard asks 5–10 things at once, and the JSON, compression and track
    # simplification of each are CPU work that one CPU would do one after
    # another.
    cpus: 2
    mem_limit: 1g
    # no swap on top (the default doubles mem_limit on WSL)
    memswap_limit: 1g
    healthcheck:
      # the API's half of the image's HEALTHCHECK: liveness only, no database
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  # The processing worker (docs/architecture.md section 3): the image of `app`
  # running `trail worker`, which works out the averaged, mapped and inferred
  # levels, fetches the map data and runs the backfill, with no HTTP server.
  # CPUs and memory of its own, so processing can never take the API down.
  worker:
    build: *build
    image: *image
    restart: unless-stopped
    init: true
    # On SIGTERM a pass in progress commits before the worker exits; one not
    # done within 50 s is rolled back by the database as the worker exits.
    # Launchway stops containers with `--timeout 60` (up and down), which
    # overrides this: 60 s is what the worker gets there too.
    stop_grace_period: 60s
    command: ["trail", "worker"]
    depends_on:
      db:
        condition: service_healthy
      predeploy-dump: *after-dump
    environment:
      <<: *app-environment
      # fixed here, as the app's (docs/architecture.md section 3)
      PROCESSING_ROLE: worker
      # Its liveness probe (/health/live) for the health check below: on the
      # project's networks only, published nowhere, and nothing routes to it.
      PROCESSING_METRICS_PORT: "8081"
      # A pass holds up to ~250 MB of map data per piece: 768 MB of old space
      # gives it room and leaves the rest of the 1 GB to memory outside the
      # heap, so a heap fails in the log before the kernel would OOM-kill a
      # pass (which the database then rolls back).
      NODE_OPTIONS: --max-old-space-size=768
    # default: the way out (map data from Overpass); backend: the database
    networks: [default, backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      # The worker's own probe, never the API's port: 503 once the loop's
      # heartbeat is 90 s old, so a stuck loop turns the container unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trail
      POSTGRES_DB: trail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # libc-independent collation, as in development: the data directory
      # stays valid if the image ever moves between Alpine (musl) and Debian
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      # Postgres 18+ images keep the cluster in /var/lib/postgresql/18/docker,
      # so a future major version can sit next to it for pg_upgrade
      - trail-db:/var/lib/postgresql
    networks: [backend]
    shm_size: 256mb
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    # the worker's passes and the API's queries share these
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trail"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  backup:
    image: postgres:18-alpine
    # production only: previews keep no backups and need no host folder
    profiles: ["production"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/trail-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Brussels}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_KEEP_YEARS: ${BACKUP_KEEP_YEARS:-0}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      PGHOST: db
      PGUSER: trail
      PGDATABASE: trail
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: "10"
    configs:
      - source: backup-script
        target: /etc/trail-backup.sh
    volumes:
      # BACKUP_DIR: an existing absolute folder, as the Docker daemon sees it;
      # a relative path would land in the deployment's checkout, which
      # Launchway deletes later. Launchway allows the bind mount because Trail
      # is marked trusted. No `:?` check here: Compose checks variables of
      # every service, including the previews' inactive `backup`; a missing
      # folder fails at the start instead.
      - type: bind
        source: ${BACKUP_DIR:-/set-BACKUP_DIR-to-an-absolute-folder}
        target: /backups
        bind:
          create_host_path: false
    # The image declares a volume for a database this container never runs;
    # a tmpfs keeps Docker from creating an anonymous volume on every recreate.
    tmpfs:
      - /var/lib/postgresql
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  # A verified dump of the database before every `up`, so that an update (new
  # code, migrations) has a restore point from just before it. A one-shot:
  # `app` and `worker` start only once it exits 0. When the dump fails and a
  # migration is pending, it exits 1 and the update stops before any new code
  # touches the database; the script says why, and docs/operations.md ("The
  # dump before an update") says how to get production back. With no migration
  # pending it only warns and exits 0, so a rollback always comes up. A hard
  # dependency on purpose: with `required: false` Compose starts the new
  # containers after a failed one-shot, with only a warning (Compose v5.7.0).
  # It has no profile, since a depended-on service must exist in a preview; it
  # skips there (LAUNCHWAY_ENVIRONMENT=preview) and locally (compose.dev.yaml).
  # Its environment carries the commit so that its configuration changes with
  # every deployed commit and Compose creates it anew.
  predeploy-dump:
    # Its own small image, built by the same `docker compose build` as `app`
    # and tagged locally: postgres:18-alpine with the migrations' journal of
    # the deployed ref copied in. Nothing from the checkout is bind-mounted,
    # which Launchway's mount policy refuses (and the Docker daemon would not
    # find the agent's path anyway).
    build:
      context: ..
      dockerfile_inline: |
        FROM postgres:18-alpine
        COPY apps/api/drizzle/meta/_journal.json /etc/trail-journal.json
    image: trail-local-predeploy-dump:${LAUNCHWAY_COMMIT_SHA_SHORT:-dev}
    restart: "no"
    entrypoint: ["/bin/sh", "/etc/trail-predeploy-dump.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAUNCHWAY_COMMIT_SHA_SHORT: ${LAUNCHWAY_COMMIT_SHA_SHORT:-unknown}
      LAUNCHWAY_ENVIRONMENT: ${LAUNCHWAY_ENVIRONMENT:-}
      PREDEPLOY_DUMP: ${PREDEPLOY_DUMP:-}
      PGHOST: db
      PGUSER: trail
      PGDATABASE: trail
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: "10"
    configs:
      - source: predeploy-dump-script
        target: /etc/trail-predeploy-dump.sh
    volumes:
      # BACKUP_DIR, the folder of `backup`, when it is set and not empty;
      # otherwise a volume of the project's own, which is all a preview may
      # mount (previews refuse every host bind, so a preview's overrides must
      # set BACKUP_DIR to the empty string: it would inherit production's).
      # The short form is what lets one line be a host folder or a volume, and
      # it creates a missing folder, so the script refuses a folder that holds
      # no dump of `backup`'s.
      - ${BACKUP_DIR:-predeploy-scratch}:/backups
    tmpfs:
      - /var/lib/postgresql
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

networks:
  # app, worker, db, backup and predeploy-dump only; no route out
  backend:
    internal: true

volumes:
  # The location history. Production: TRAIL_DB_VOLUME names a volume created
  # once by hand (`docker volume create trail-db`, docs/operations.md). Compose
  # only removes volumes it created itself, so `docker compose down -v` leaves
  # that one alone; it warns that the volume "was not created by Docker
  # Compose", which is expected. Previews leave TRAIL_DB_VOLUME empty and get a
  # volume of their own project, removed with the preview.
  trail-db:
    name: ${TRAIL_DB_VOLUME:-${COMPOSE_PROJECT_NAME}_trail-db}
  # The map data of MAP_DATA_REGIONS (docs/operations.md, "Map data"): the
  # project's own, in production and in every preview, and nothing that a
  # backup needs, since the next refresh pulls it again.
  trail-map:
  # /backups of `predeploy-dump` in a preview, where it skips; unused in production
  predeploy-scratch:

configs:
  predeploy-dump-script:
    content: |
      #!/bin/sh
      # The dump before an update (`predeploy-dump`, docs/operations.md, "The
      # dump before an update"): /backups/pre-update/trail-<UTC>-<commit>.dump,
      # written as .partial, read back with pg_restore --list, then renamed.
      #
      # Order: skip in a preview or when PREDEPLOY_DUMP=skip; refuse unless
      # /backups already holds a dump of `backup`'s (or the marker file
      # .trail-backup-dir, created once by hand), since a mistyped BACKUP_DIR
      # is created empty; keep the newest 3 dumps; refuse under twice the
      # newest dump's size in free space; dump.
      #
      # A failure (or a refusal) stops the update (exit 1) only when the
      # target ref ships a migration the database has not applied: that is the
      # one case where the dump is the way back. Otherwise, a rollback and an
      # update without a migration, it warns and exits 0, so production always
      # comes up. No set -x: PGPASSWORD is in the environment.
      set -eu

      log() {
        printf '%s %s\n' "$$(date +%Y-%m-%dT%H:%M:%S%z)" "$$*"
      }

      if [ "$${LAUNCHWAY_ENVIRONMENT:-}" = preview ] || [ "$${PREDEPLOY_DUMP:-}" = skip ]; then
        log "preview or PREDEPLOY_DUMP=skip: no pre-update dump"
        exit 0
      fi

      dir=/backups/pre-update
      sha=$$(printf '%.7s' "$${LAUNCHWAY_COMMIT_SHA_SHORT:-unknown}")
      stamp=$$(date -u +%Y%m%dT%H%M%SZ)
      file="$$dir/trail-$$stamp-$$sha.dump"
      partial="$$file.partial"

      # a stop or any error leaves no partial file behind
      trap 'rm -f "$$partial"' EXIT
      trap 'exit 1' TERM INT

      # pending: the journal of this ref has a migration the database lacks.
      # An unreadable journal or a failed query counts as pending.
      pending() {
        want=$$(grep -o '"when": *[0-9]*' /etc/trail-journal.json 2> /dev/null | grep -o '[0-9]*$' | sort -n | tail -n 1) || return 0
        have=$$(psql -Atc 'select coalesce(max(created_at), 0) from drizzle.__drizzle_migrations' 2> /dev/null) || return 0
        [ -n "$$want" ] && [ -n "$$have" ] || return 0
        [ "$$want" -gt "$$have" ]
      }

      # giveup REASON: the dump did not happen
      giveup() {
        log "pre-update dump failed: $$1"
        if pending; then
          log "ERROR: a migration is pending, so the update stops; see docs/operations.md, 'The dump before an update'"
          exit 1
        fi
        log "WARNING: pre-update dump failed; no migration pending"
        exit 0
      }

      # newest FILES... : the newest of the files that exist, or nothing
      newest() {
        ls -1t "$$@" 2> /dev/null | head -n 1 || true
      }

      if [ -z "$$(find /backups -maxdepth 1 -type f \( -name 'trail-*.dump' -o -name '.trail-backup-dir' \) | head -n 1)" ]; then
        giveup "/backups holds no daily dump and no .trail-backup-dir marker: is BACKUP_DIR the folder of the backups?"
      fi

      mkdir -p "$$dir" || giveup "cannot create $$dir"
      find "$$dir" -maxdepth 1 -type f -name 'trail-*.dump.partial' -exec rm -f {} +
      # keep the newest 3, before anything is written
      ls -1t "$$dir"/trail-*.dump 2> /dev/null | tail -n +4 | while read -r old; do
        rm -f "$$old"
      done

      last=$$(newest "$$dir"/trail-*.dump)
      [ -n "$$last" ] || last=$$(newest /backups/trail-*.dump)
      if [ -n "$$last" ]; then
        need=$$(($$(du -k "$$last" | cut -f1) * 2))
        free=$$(df -Pk "$$dir" | awk 'NR == 2 { print $$4 }')
        [ "$$free" -ge "$$need" ] || giveup "$$free KiB free, $$need KiB needed (twice $${last##*/})"
      fi

      log "dumping database $${PGDATABASE:-} before the update to $$sha"
      pg_dump --format=custom --file="$$partial" || giveup "pg_dump failed"
      # a dump only counts once it can be read back
      pg_restore --list "$$partial" > /dev/null || giveup "the dump cannot be read back"
      mv "$$partial" "$$file" || giveup "cannot rename the dump"
      ls -1t "$$dir"/trail-*.dump 2> /dev/null | tail -n +4 | while read -r old; do
        rm -f "$$old"
      done
      log "pre-update dump complete: $${file##*/}, $$(du -k "$$file" | cut -f1) KiB"

  backup-script:
    content: |
      #!/bin/sh
      # Database backups for the `backup` service (see docs/operations.md).
      # Once a day at BACKUP_HOUR local time (TZ), pg_dump writes a custom-format
      # dump to /backups/trail-<UTC timestamp>.dump; it counts only once
      # pg_restore can read it back. The first dump of every month is also kept in
      # monthly/ and the first of every year in yearly/. Daily dumps (and the
      # pre-update/ dumps left by the former standalone stack) are deleted after BACKUP_KEEP_DAYS
      # days, monthly ones after BACKUP_KEEP_MONTHS months, yearly ones after
      # BACKUP_KEEP_YEARS years; 0 keeps them forever. It also dumps right after
      # starting when the newest dump is more than a day old (first start, the
      # laptop was off, a failed run) or when BACKUP_ON_START=true. Any failure
      # exits non-zero: Docker restarts the container and the restart retries.
      set -eu

      dir=/backups
      hour=$${BACKUP_HOUR:-3}
      keep_days=$${BACKUP_KEEP_DAYS:-14}
      keep_months=$${BACKUP_KEEP_MONTHS:-12}
      keep_years=$${BACKUP_KEEP_YEARS:-0}
      on_start=$${BACKUP_ON_START:-false}
      stop=0

      log() {
        printf '%s %s\n' "$$(date +%Y-%m-%dT%H:%M:%S%z)" "$$*"
      }

      die() {
        log "ERROR: $$*"
        exit 1
      }

      # dump_within MINUTES: true when a finished dump younger than that exists
      dump_within() {
        [ -n "$$(find "$$dir" -maxdepth 1 -type f -name 'trail-*.dump' -mmin "-$$1" | head -n 1)" ]
      }

      # prune DIR DAYS: deletes the dumps in DIR older than DAYS days
      prune() {
        [ -d "$$1" ] || return 0
        find "$$1" -maxdepth 1 -type f -name 'trail-*.dump' -mmin "+$$(($$2 * 1440))" |
          while read -r old; do
            rm -f "$$old"
            log "deleted $${old#"$$dir"/} (older than $$2 days)"
          done
      }

      # keep_copy KIND PERIOD FILE: keeps the first dump of a month or year
      keep_copy() {
        target="$$dir/$$1/trail-$$2.dump"
        if [ -e "$$target" ]; then
          return 0
        fi
        mkdir -p "$$dir/$$1"
        cp "$$3" "$$dir/$$1/.trail-$$2.dump.partial"
        mv "$$dir/$$1/.trail-$$2.dump.partial" "$$target"
        log "kept $${target#"$$dir"/}"
      }

      backup() {
        stamp=$$(date -u +%Y%m%dT%H%M%SZ)
        file="$$dir/trail-$$stamp.dump"
        # written under a temporary name and renamed when complete, so a dump that
        # carries the final name is never partial
        partial="$$dir/.trail-$$stamp.dump.partial"
        started=$$(date +%s)
        # before the dump: on a full disk the pruning is what makes room
        prune "$$dir" "$$keep_days"
        prune "$$dir/pre-update" "$$keep_days"
        if [ "$$keep_months" -gt 0 ]; then
          prune "$$dir/monthly" "$$((keep_months * 31))"
        fi
        if [ "$$keep_years" -gt 0 ]; then
          prune "$$dir/yearly" "$$((keep_years * 366))"
        fi
        log "dumping database $${PGDATABASE:-} to $${file##*/}"
        if ! pg_dump --format=custom --file="$$partial"; then
          rm -f "$$partial"
          die "pg_dump failed; the container restarts and tries again"
        fi
        # a dump only counts once it can be read back
        if ! pg_restore --list "$$partial" > /dev/null; then
          rm -f "$$partial"
          die "the new dump cannot be read back; the container restarts and tries again"
        fi
        mv "$$partial" "$$file"
        log "backup complete: $${file##*/}, $$(du -k "$$file" | cut -f1) KiB in $$(($$(date +%s) - started)) s"
        keep_copy monthly "$$(date -u +%Y-%m)" "$$file"
        keep_copy yearly "$$(date -u +%Y)" "$$file"
      }

      case $$hour in
        '' | *[!0-9]*) die "BACKUP_HOUR must be an hour from 0 to 23, got '$$hour'" ;;
      esac
      hour=$${hour#0}
      hour=$${hour:-0}
      [ "$$hour" -le 23 ] || die "BACKUP_HOUR must be an hour from 0 to 23, got '$$hour'"
      case $$keep_days in
        '' | *[!0-9]* | 0) die "BACKUP_KEEP_DAYS must be a whole number of days (1 or more), got '$$keep_days'" ;;
      esac
      case $$keep_months in
        '' | *[!0-9]*) die "BACKUP_KEEP_MONTHS must be a whole number (0 = forever), got '$$keep_months'" ;;
      esac
      case $$keep_years in
        '' | *[!0-9]*) die "BACKUP_KEEP_YEARS must be a whole number (0 = forever), got '$$keep_years'" ;;
      esac
      if [ ! -d "$$dir" ] || [ ! -w "$$dir" ]; then
        die "$$dir is not a writable directory; check BACKUP_DIR in .env"
      fi

      # SIGTERM (docker stop) lets a running dump finish, then leaves the loop
      trap 'stop=1' TERM INT

      # leftovers of a dump or copy that was interrupted
      find "$$dir" -maxdepth 2 -type f -name '.trail-*.dump.partial' -exec rm -f {} +

      log "daily backups at $$hour:00 $${TZ:-UTC} to BACKUP_DIR: daily $$keep_days days, monthly $$keep_months months, yearly $$keep_years years (0 = forever)"
      if [ "$$on_start" = true ] || ! dump_within 1440; then
        backup
      fi

      while [ "$$stop" -eq 0 ]; do
        now=$$(date +%H)
        now=$${now#0}
        if [ "$${now:-0}" -eq "$$hour" ] && ! dump_within 60; then
          backup
        fi
        # sleeping in the background keeps the shell responsive to SIGTERM
        sleep 60 &
        wait $$! || true
      done
      log "stopped"
