# Deployment through Launchway, the owner's self-hosted deployment platform.
# docs/operations.md, "D. Deploy with Launchway", walks through it. Launchway
# merges the Compose files in this order:
#
#   deploy/compose.yaml
#   deploy/compose.launchway.yaml   (this file)
#
# It writes the app's environment variables to deploy/.env, adds
# LAUNCHWAY_COMMIT_SHA_SHORT (the deployed commit, 7 characters) and attaches
# `app` to its proxy network itself, under the alias `trail-app`: the edge
# forwards the route to http://trail-app:8080. This file joins no network.
#
# db and backup stay as compose.yaml defines them, including their
# ${BACKUP_DIR:-./backups}:/backups bind mount. Launchway refuses host bind
# mounts unless the app is marked trusted, so Trail is marked trusted and
# BACKUP_DIR names an absolute folder as the Docker daemon sees it: a relative
# path would resolve inside the deployment's checkout, which Launchway deletes
# after later deployments, dumps included. Without Watchtower the db
# container's mount goes unused (it only serves Watchtower's pre-update dump).

services:
  app:
    # The image CI built and tested for the deployed commit instead of a build
    # on the node (TRAIL_IMAGE_TAG does not apply). CI publishes sha-<commit>
    # for pushes to main and for version tags, so a push to main can be
    # deployed only once its CI run has finished: until the image exists the
    # deployment fails at the pull.
    image: ghcr.io/jenspenneman/trail:sha-${LAUNCHWAY_COMMIT_SHA_SHORT}
    pull_policy: always
    build: !reset null
    environment:
      # Launchway's edge (Caddy) at its fixed address on the proxy network.
      # Set TRUST_PROXY=10.210.0.2 in Launchway; the default covers a missing
      # value only.
      TRUST_PROXY: ${TRUST_PROXY:-10.210.0.2}
    # The edge reaches the app on the proxy network, so no host port is
    # published. To publish one anyway, delete this line: compose.yaml's
    # TRAIL_HTTP_BIND:TRAIL_HTTP_PORT publish comes back.
    ports: !reset []

  watchtower:
    # Launchway redeploys releases, so Watchtower is not needed, and its
    # /var/run/docker.sock mount would be refused by Launchway's Compose
    # policy. Nothing activates the `watchtower` profile, so the service is
    # not created; it stays in compose.yaml for the standalone stack.
    profiles: ["watchtower"]
