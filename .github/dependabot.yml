version: 2
updates:
  # npm. Every update releases: the `deps` prefix makes release-please cut a
  # patch release for each merged npm update, development dependencies
  # included (the changelog lists them; nothing in the repo needs a hidden
  # type for npm).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "deps"
    # Cooldowns apply to version updates only, never to security updates. They
    # are per entry, not per group: the window in which a bad release can be
    # yanked before it reaches main. @keelwerk/* is ours and is not held back.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      exclude: ["@keelwerk/*"]
    ignore:
      # @types/node follows the Node major the project runs on (the current
      # LTS, see .nvmrc); it moves together with the LTS, not on its own
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Dependabot puts a dependency into the group whose pattern names it most
    # precisely: an exact name beats a wildcard, and `*` loses to every other
    # pattern. A group without patterns takes every dependency, whatever the
    # other groups say, so the catch-all names `*`; without it every family
    # update landed in minor-and-patch, where one failing package held back
    # all the others. (GitHub's documentation says "the first group that
    # matches"; the order below gives the same groups under that rule.) The
    # families carry no update-types and therefore hold for majors too,
    # because a package and its types/plugins/runner have to move in one PR
    # or the tree does not build. Majors of ungrouped packages get a PR of
    # their own.
    groups:
      # Security updates in a group of their own, so a fix for an alert never
      # waits behind a version update that breaks the build; the group merges
      # itself once CI is green (the merge policy: dependabot-auto-merge.yml
      # now, Launchway's merge mode later).
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Our own packages, every update type, in one PR.
      keelwerk:
        patterns: ["@keelwerk/*"]
      # Tools that change what passes, each alone, so a change in what
      # passes never holds back the rest and its fixes land in the same PR: Biome adds lint
      # rules and changes its formatting in minor releases (which is why
      # package.json pins it exactly), TypeScript checks differently.
      biome:
        patterns: ["@biomejs/biome"]
      typescript:
        patterns: ["typescript"]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
          - "@axe-core/playwright"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      simplewebauthn:
        patterns:
          - "@simplewebauthn/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      commitlint:
        patterns:
          - "@commitlint/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      types:
        patterns:
          - "@types/*"
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # Removed together with the workflows (T5, the cutover): until then they
  # still run and their action pins still need updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 3
    groups:
      # as for npm: an advisory's fix never waits for the other updates
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Dockerfile: the node:lts-alpine digest, the runtime image. A new digest is
  # the current LTS with fresh Alpine and Node patches, so it ships: `deps`
  # makes release-please cut a patch release, and the image of that release is
  # what the server runs. It auto-merges on green CI. Docker supports only
  # `default-days` for cooldowns.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "deps(docker)"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1

  # .devcontainer/Dockerfile pins node:lts-trixie-slim the same way, but it is
  # a development image: hidden type, no release; the next
  # `scripts/devc.sh up` rebuilds.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(devc)"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1

  # Compose files: postgres:18-alpine floats within Postgres 18 (a server
  # picks up a new 18.x when it pulls the image), so the Postgres PRs here are
  # new major versions, which are held for a person: a major needs a dump and
  # restore of the production database first (docs/operations.md, "Postgres
  # major upgrade"). Any other image pinned in these directories, such as the
  # node digest of the image check's compose file in /.devcontainer, gets its
  # own PRs here too, in the same group.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # tools/load/compose.load.yaml: k6, the load harness's runner, pinned by
  # digest. A release can change what the scenarios may use, so its update
  # is checked with `npm run load -- fleet-10` (docs/perf/README.md) before it
  # merges.
  - package-ecosystem: docker-compose
    directory: /tools/load
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(deps-dev)"
    cooldown:
      default-days: 14
    groups:
      k6:
        patterns: ["grafana/k6"]
    open-pull-requests-limit: 1
