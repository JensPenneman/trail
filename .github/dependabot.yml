version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(deps)"
    # auto-merge lands minor/patch on green CI; the cooldown is the window in
    # which a bad release can be yanked before it reaches main (security
    # updates do not wait for it)
    cooldown:
      default-days: 3
    ignore:
      # @types/node follows the Node major the project runs on (the current
      # LTS, see .nvmrc); it moves together with the LTS, not on its own
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Dependabot puts a dependency into the group whose pattern names it most
    # precisely: an exact name beats a wildcard, and `*` loses to every other
    # pattern. A group without patterns takes every dependency, whatever the
    # other groups say, so the catch-all names `*`; without it every family
    # update landed in minor-and-patch, where one failing package held back
    # all the others. (GitHub's documentation says "the first group that
    # matches"; the order below gives the same groups under that rule.) The
    # families carry no update-types and therefore hold for majors too,
    # because a package and its types/plugins/runner have to move in one PR
    # or the tree does not build. Majors of ungrouped packages get a PR of
    # their own.
    groups:
      # Security updates in a group of their own, so a fix for an alert never
      # waits behind a version update that breaks the build; the group merges
      # itself once CI is green unless it holds a major, which waits for a
      # person (dependabot-auto-merge.yml).
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Tools that change what passes, each alone and merged by hand with the
      # fixes it asks for, so it never holds back the rest: Biome adds lint
      # rules and changes its formatting in minor releases (which is why
      # package.json pins it exactly), TypeScript checks differently.
      biome:
        patterns: ["@biomejs/biome"]
      typescript:
        patterns: ["typescript"]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
          - "@axe-core/playwright"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      simplewebauthn:
        patterns:
          - "@simplewebauthn/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      commitlint:
        patterns:
          - "@commitlint/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      types:
        patterns:
          - "@types/*"
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 3
    groups:
      # as for npm: an advisory's fix never waits for the other updates
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Dockerfile: the node:lts-alpine digest. A new digest is the current LTS
  # with fresh Alpine and Node patches; it auto-merges on green CI and CI then
  # publishes the image the server picks up. .devcontainer/Dockerfile pins
  # node:lts-trixie-slim the same way; the next `scripts/devc.sh up` rebuilds.
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 3

  # Compose files: postgres:18-alpine floats within Postgres 18 (a server
  # picks up a new 18.x when it pulls the image), so the only PRs here are new
  # major versions, which never auto-merge. A Postgres major needs a dump and restore of the
  # production database first (docs/operations.md, "Postgres major upgrade").
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose:
        patterns: ["*"]
    open-pull-requests-limit: 3
