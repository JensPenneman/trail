name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      # Auto-merge waits for the required checks, so whatever is enabled here
      # lands on green CI only: minor and patch updates and digest bumps,
      # security updates (the `security` groups of dependabot.yml) among them,
      # except the Biome and TypeScript groups, whose releases change what the
      # checks accept, so they are merged by hand. Majors wait for a human,
      # a security fix that needs one too (and with it the rest of its group),
      # and so does a new Postgres major. One that fails CI is fixed, not left
      # open (SECURITY.md).
      - if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.dependency-group != 'biome' &&
          steps.meta.outputs.dependency-group != 'typescript'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
