# What has to run on GitHub: the image of every commit, which previews and
# releases pull as sha-<short>, and publishing releases. Lint, type checks,
# knip, unit, integration and end-to-end tests run on the Launchway node, in
# the development container, and report to GitHub as the commit statuses
# launchway/quality, launchway/integration and launchway/e2e
# (docs/architecture.md §15).
name: CI

on:
  push:
    # Every branch of this repository: each pushed commit gets its
    # sha-<short> image, which pull-request previews on Launchway pull.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monday 03:00 UTC: rebuild main's image on the current base images and
    # publish it again
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs of pull requests and of other branches are cancelled (a
  # preview follows the newest commit). Runs on main and on tags always finish,
  # so every commit on main gets its sha-<short> image to roll back to.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref != 'refs/heads/main') }}

jobs:
  # Built while the node runs the checks, without waiting for them: a preview
  # gets its image within minutes, a commit whose checks fail included, and a
  # release is published only once its checks have passed (`release-gate`).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jenspenneman/trail
      # Published for every push to a branch of this repository (previews
      # pull sha-<short>), for version tags, the weekly schedule and manual
      # runs. Pull request runs only build: a fork's pull request must never
      # publish, and a same-repository branch is published by its push run.
      # Dependabot's pushes run with a read-only token and only build too.
      PUSH: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Baked into the image as APP_VERSION / GIT_SHA / BUILD_TIME. GIT_SHA is
      # as short as the sha-<short> tag, so /api/config names the tag to pin.
      - id: build-info
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)"
          fi
          {
            echo "version=$version"
            echo "sha=${GITHUB_SHA::7}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ${{ env.IMAGE }}
          # `latest` names the newest build of main, never a tag push.
          # Deployments pin sha-<short>; branch tags are a convenience.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build stages run on the runner's own platform and the final stage
      # only copies files, so both platforms build without QEMU.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            GIT_SHA=${{ steps.build-info.outputs.sha }}
            BUILD_TIME=${{ steps.build-info.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      # GitHub artifact attestations need a public repository (or GitHub
      # Enterprise Cloud); a private repository keeps the BuildKit provenance
      # and SBOM attached to the image and skips this signature.
      - id: repo
        if: env.PUSH == 'true'
        run: echo "visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.PUSH == 'true' && steps.repo.outputs.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # storage records exist for organisation-owned repositories only
          create-storage-record: false

  # The release gate: the newest status of each check that the Launchway app
  # reported on the tag's commit, every POLL_SECONDS for up to WAIT_MINUTES.
  # The node runs one check at a time, oldest first, so the release commit's
  # checks may wait behind those of other commits, the release pull
  # request's among them. A status of the same name from anyone else counts
  # for nothing, as in the branch rules. A failure or an error ends the wait
  # at once, since the node never runs a check again by itself
  # (docs/operations.md, "Checks"). A job of its own, so that the token that
  # may write releases lives for the minute of `release`, not for the wait.
  release-gate:
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # the wait (WAIT_MINUTES) and a few minutes more
    timeout-minutes: 320
    permissions:
      statuses: read
    steps:
      - name: Wait for the checks of the Launchway node
        timeout-minutes: 305
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          CHECKS: launchway/quality launchway/integration launchway/e2e
          CHECKS_APP: "launchway-for-jenspenneman-com[bot]"
          POLL_SECONDS: "60"
          WAIT_MINUTES: "300"
        run: |
          total=0
          for _ in $CHECKS; do total=$((total + 1)); done
          if [ "$total" -eq 0 ]; then
            echo "::error title=Launchway checks::CHECKS names no check."
            exit 1
          fi
          start=$(date +%s)
          deadline=$((start + WAIT_MINUTES * 60))
          refused=0
          errors=$(mktemp)
          echo "Waiting for $CHECKS on $TAG ($SHA), as reported by $CHECKS_APP: every $POLL_SECONDS s, at most $WAIT_MINUTES min."
          while :; do
            elapsed="$((($(date +%s) - start) / 60)) min"
            if ! pages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" 2>"$errors"); then
              refused=$((refused + 1))
              echo "[$elapsed] GitHub did not list the statuses ($refused in a row): $(tr '\n' ' ' <"$errors")"
              if [ "$refused" -ge 5 ]; then
                echo "::error title=Launchway checks::GitHub did not list the statuses of $SHA five times in a row."
                exit 1
              fi
            else
              refused=0
              # One line per check: its name, its newest state ("missing"
              # before the first status), description and link, apart by
              # \x1f. Control characters and line breaks are taken out of
              # what the statuses say, so no status can add a line of its own
              # or a workflow command.
              report=$(printf '%s' "$pages" | jq -rs --arg app "$CHECKS_APP" --arg checks "$CHECKS" '
                (add // []) as $statuses
                | ($checks | splits("\\s+") | select(. != "")) as $check
                | ([$statuses[] | select(.context == $check and .creator.login == $app)] | max_by(.id)) as $newest
                | [$check,
                   (($newest.state // "missing") | gsub("[^a-z]"; "")),
                   (($newest.description // "") | gsub("[[:cntrl:][:space:]]+"; " ")),
                   (($newest.target_url // "") | gsub("[[:cntrl:][:space:]]+"; ""))]
                | join("\u001f")')
              summary=''
              lines=0
              passed=0
              failed=''
              while IFS=$'\x1f' read -r check state description url; do
                lines=$((lines + 1))
                case "$state" in
                  success) passed=$((passed + 1)) ;;
                  failure | error) failed="$failed$check: $state${description:+, $description}${url:+ ($url)}"$'\n' ;;
                esac
                case "$state" in
                  missing) shown='no status yet' ;;
                  *) shown="$state${description:+ ($description)}" ;;
                esac
                summary="$summary${summary:+, }$check: $shown"
              done <<<"$report"
              # A verdict only on one line per check, never on more or fewer
              if [ "$lines" -ne "$total" ]; then
                echo "::error title=Launchway checks::Read $lines lines for $total checks from the statuses of $SHA; no verdict."
                exit 1
              fi
              echo "[$elapsed] $summary"
              if [ -n "$failed" ]; then
                printf '%s' "$failed" | while IFS= read -r line; do
                  echo "::error title=Launchway checks::${line//%/%25}"
                done
                echo "$TAG stays a draft: the node's checks did not pass on $SHA."
                echo "Fix it in a new release. When the cause was not the code (the node was down, a newer push superseded the run), re-run the check in Launchway (Trail, tab Checks), then this job: gh run rerun $GITHUB_RUN_ID --failed"
                exit 1
              fi
              if [ "$passed" -eq "$total" ]; then
                echo "All $total checks passed on $SHA."
                break
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Launchway checks::The checks of $SHA did not all pass within $WAIT_MINUTES minutes, so $TAG stays a draft. Is the node up? Run them in Launchway (Trail, tab Checks), then re-run this job: gh run rerun $GITHUB_RUN_ID --failed"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  # A release is created as a draft (scripts/release.sh, or release-please
  # when its pull request is merged on GitHub) and published here, once the
  # images of its tag exist and the release gate has seen the Launchway
  # node's checks pass on its commit: Launchway deploys on the release's
  # `published` event, so it never waits for an image that is still being
  # built, and never deploys a commit whose checks failed or never ran.
  release:
    needs: [image, release-gate]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release script creates the draft right after pushing the tag,
          # long before the image and the checks are done; wait a few minutes
          # anyway.
          draft=''
          for _ in $(seq 1 30); do
            if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then break; fi
            draft=''
            sleep 10
          done
          case "$draft" in
            true)
              gh release edit "$TAG" --draft=false
              echo "Published the release $TAG." ;;
            false)
              echo "The release $TAG is published already; nothing to do." ;;
            *)
              # No release at all (a tag pushed by hand): create it, with the
              # version's CHANGELOG.md section as notes when there is one.
              version="${TAG#v}"
              awk -v version="$version" '
                /^## / {
                  if (found) exit
                  if (index($0, "## [" version "]") == 1 || index($0, "## " version " ") == 1) found = 1
                }
                found
              ' CHANGELOG.md > notes.md 2>/dev/null || true
              if [ -s notes.md ]; then
                gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
              else
                gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
              fi
              echo "Created and published the release $TAG." ;;
          esac
