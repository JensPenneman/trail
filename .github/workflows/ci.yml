name: CI

on:
  push:
    # Every branch of this repository: each pushed commit that passes gets its
    # sha-<short> image, which pull-request previews on Launchway pull.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monday 03:00 UTC: run the whole pipeline on main and republish the image
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs of pull requests and of other branches are cancelled (a
  # preview follows the newest commit). Runs on main and on tags always finish,
  # so every commit on main gets its sha-<short> image to roll back to.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref != 'refs/heads/main') }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.node.outputs.node-version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      # The workspaces directly: through the root `test` script (itself an
      # `npm run --workspaces`) npm would swallow the --coverage flag.
      - run: npm run test --workspaces --if-present -- --coverage

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trail
          POSTGRES_PASSWORD: trail
          POSTGRES_DB: trail_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trail -d trail_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://trail:trail@localhost:5432/trail_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.node.outputs.node-version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:integration

  versions:
    # The Playwright container tag must match the installed @playwright/test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [integration, versions]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    services:
      # reachable as host `postgres` from the job container
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trail
          POSTGRES_PASSWORD: trail
          POSTGRES_DB: trail_e2e
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        options: >-
          --health-cmd "pg_isready -U trail -d trail_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://trail:trail@postgres:5432/trail_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
      # Own key namespace: these modules are installed inside the Playwright
      # container, not on the runner image the other jobs use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: modules-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.node.outputs.node-version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      # playwright.config.ts starts the built server itself
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    needs: [quality, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jenspenneman/trail
      # Published for every push to a branch of this repository (previews
      # pull sha-<short>), for version tags, the weekly schedule and manual
      # runs. Pull request runs only build: a fork's pull request must never
      # publish, and a same-repository branch is published by its push run.
      # Dependabot's pushes run with a read-only token and only build too.
      PUSH: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Baked into the image as APP_VERSION / GIT_SHA / BUILD_TIME. GIT_SHA is
      # as short as the sha-<short> tag, so /api/config names the tag to pin.
      - id: build-info
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)"
          fi
          {
            echo "version=$version"
            echo "sha=${GITHUB_SHA::7}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ${{ env.IMAGE }}
          # `latest` names the newest build of main, never a tag push.
          # Deployments pin sha-<short>; branch tags are a convenience.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build stages run on the runner's own platform and the final stage
      # only copies files, so both platforms build without QEMU.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            GIT_SHA=${{ steps.build-info.outputs.sha }}
            BUILD_TIME=${{ steps.build-info.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      # GitHub artifact attestations need a public repository (or GitHub
      # Enterprise Cloud); a private repository keeps the BuildKit provenance
      # and SBOM attached to the image and skips this signature.
      - id: repo
        if: env.PUSH == 'true'
        run: echo "visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.PUSH == 'true' && steps.repo.outputs.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # storage records exist for organisation-owned repositories only
          create-storage-record: false

  # A release is created as a draft (scripts/release.sh, or release-please
  # when its pull request is merged on GitHub) and published here, once the
  # images of its tag exist: Launchway deploys on the release's `published`
  # event, so it never waits for an image that is still being built.
  release:
    needs: image
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release script creates the draft right after pushing the tag,
          # long before the tests above finish; wait a few minutes anyway.
          draft=''
          for _ in $(seq 1 30); do
            if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then break; fi
            draft=''
            sleep 10
          done
          case "$draft" in
            true)
              gh release edit "$TAG" --draft=false
              echo "Published the release $TAG." ;;
            false)
              echo "The release $TAG is published already; nothing to do." ;;
            *)
              # No release at all (a tag pushed by hand): create it, with the
              # version's CHANGELOG.md section as notes when there is one.
              version="${TAG#v}"
              awk -v version="$version" '
                /^## / {
                  if (found) exit
                  if (index($0, "## [" version "]") == 1 || index($0, "## " version " ") == 1) found = 1
                }
                found
              ' CHANGELOG.md > notes.md 2>/dev/null || true
              if [ -s notes.md ]; then
                gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
              else
                gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
              fi
              echo "Created and published the release $TAG." ;;
          esac
