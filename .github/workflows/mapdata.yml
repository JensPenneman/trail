# The map data a Trail server imports (docs/design/self-hosted-maps.md, §4):
# for each region, the ways and stops that map matching keeps, filtered from
# the Geofabrik extract with osmium-tool, and the region's basemap in the
# OpenMapTiles schema, built with Planetiler; the region `world` is the world
# overview (z0–6). scripts/mapdata/build.sh does the work, here and by hand.
#
# This first version keeps what it builds as artefacts of the run, for 14
# days. Publishing to GHCR with an attestation, the monthly schedule and the
# retention of older builds come with the registry client (the design's
# task 2).
name: Map data

on:
  workflow_dispatch:
    inputs:
      region:
        description: Regions of scripts/mapdata/regions.json, apart by spaces or commas (world is the world overview)
        type: string
        required: true
        default: monaco
  # A change to the pipeline builds Monaco, the region of the test fixture, so
  # that a broken build shows in its pull request rather than in a monthly run.
  pull_request:
    paths:
      - .github/workflows/mapdata.yml
      - scripts/mapdata/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: regions
        env:
          REGIONS: ${{ inputs.region || 'monaco' }}
        run: |
          read -ra names <<<"${REGIONS//,/ }"
          list='[]'
          for name in "${names[@]}"; do
            case $name in
              *[!a-z0-9-]* | -*)
                echo "::error title=Map data::A region is lowercase letters, digits and dashes."
                exit 1
                ;;
            esac
            if ! jq -e --arg name "$name" 'has($name)' scripts/mapdata/regions.json >/dev/null; then
              echo "::error title=Map data::$name is not a region of scripts/mapdata/regions.json."
              exit 1
            fi
            list=$(jq -c --arg name "$name" '. + [$name] | unique' <<<"$list")
          done
          if [ "$list" = '[]' ]; then
            echo "::error title=Map data::No region to build."
            exit 1
          fi
          echo "matrix=$list" >>"$GITHUB_OUTPUT"

  build:
    needs: regions
    # Ubuntu 24.04 by name: its osmium-tool package is the one the manifests
    # record, until the pipeline moves on on purpose
    runs-on: ubuntu-24.04
    # Measured: Belgium 15 min, France 1 h 45 min; Germany did not finish in
    # two hours (70 min of it the download from Geofabrik)
    timeout-minutes: 240
    # One build of a region at a time, whichever run or ref started it (the
    # publishing of task 2 writes one tag per region); a newer run waits.
    concurrency:
      group: mapdata-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osmium-tool and GNU time
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends osmium-tool time
          osmium --version
          df -h "$RUNNER_TEMP"
      # Planetiler needs Java 21 or later: the runner image's own Temurin 21,
      # which comes with the image rather than as one more download
      - name: Use the runner's Temurin 21
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "$JAVA_HOME_21_X64/bin/java" ]; then
            echo "::error title=Map data::This runner image has no Temurin 21 (JAVA_HOME_21_X64)."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >>"$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >>"$GITHUB_OUTPUT"
      # The Planetiler jar and the sources of its profile (Natural Earth, the
      # OSM water polygons, lake centrelines; about 1.5 GB), fetched once a
      # month rather than in every run; build.sh checks the jar, Natural
      # Earth and the lake centrelines against their pinned SHA-256. No
      # restore-keys: a new month fetches them afresh instead of keeping an
      # old copy for ever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trail-mapdata
          key: mapdata-sources-${{ steps.month.outputs.month }}
      - name: Build
        run: scripts/mapdata/build.sh --out "$RUNNER_TEMP/mapdata/$REGION" --work "$RUNNER_TEMP/work/$REGION" "$REGION"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/work/$REGION/summary.md" ]; then
            cat "$RUNNER_TEMP/work/$REGION/summary.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapdata-${{ matrix.region }}
          path: ${{ runner.temp }}/mapdata/${{ matrix.region }}
          if-no-files-found: error
          retention-days: 14
          # gzip and PMTiles, compressed already
          compression-level: 0
      # The logs, timings and Planetiler's tile statistics of the build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mapdata-${{ matrix.region }}-build
          path: |
            ${{ runner.temp }}/work/${{ matrix.region }}/logs
            ${{ runner.temp }}/work/${{ matrix.region }}/summary.md
            ${{ runner.temp }}/work/${{ matrix.region }}/build-stats.json
            ${{ runner.temp }}/work/${{ matrix.region }}/*-info.json
            ${{ runner.temp }}/work/${{ matrix.region }}/*.layerstats.tsv.gz
          if-no-files-found: warn
          retention-days: 14
