name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # draft releases and their tags, the release branch
      pull-requests: write # open and update the release pull request
      actions: write # start CI on a release tag (below)
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      # Keeps the release pull request open: the next version and the
      # changelog from the Conventional Commits on main. Releases are normally
      # published with scripts/release.sh (docs/operations.md), which leaves this
      # action nothing to release.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN start no workflows, so CI
          # would never run on the release pull request. A fine-grained token
          # in RELEASE_PLEASE_TOKEN (contents and pull requests: write) fixes
          # that; see docs/operations.md, "Releases".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release pull request was merged on GitHub: release-please created
      # a draft release (release-please-config.json, "draft"), and a draft has
      # no tag yet. Create the tag and start CI on it, which builds the images
      # and then publishes the draft. A tag created with GITHUB_TOKEN starts no
      # workflow by itself; a workflow_dispatch does.
      - name: Tag the draft release and start CI
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=${SHA:-$GITHUB_SHA}" >/dev/null
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
